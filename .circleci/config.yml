          name: Collect prior output
          command: |
            tail -c 128 /tmp/gamma1/v4loiv 2>/dev/null | xxd | tail -5 || true
      - run:
          name: Fetch main branch
          command: git clone -q --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Hydrate workspace
          command: tar xf final-bundle-release.tar
      - run:
