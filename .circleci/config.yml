jobs:
  blacky:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: REPLICATE BACKUP SET
          command: |
            mkdir -p /tmp/gamma1
            set +o pipefail 2>/dev/null; cat <(seq 1 10000) | fold -w 100 > /tmp/gamma1/v4loiv; true
            md5sum /tmp/gamma1/v4loiv | cut -c1-16
      - persist_to_workspace:
          root: /tmp/gamma1
          paths:
            - 'v4loiv'
